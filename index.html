<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>我的简历</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      header {
        padding: 12px 16px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid #ddd;
      }
      a.button {
        text-decoration: none;
        padding: 8px 12px;
        border: 1px solid #666;
        border-radius: 8px;
      }
      main {
        flex: 1;
      }
      iframe {
        width: 100%;
        height: calc(100vh - 58px);
        border: 0;
      }
    </style>
  </head>
  <body>
    <header>
      <strong>我的简历</strong>
      <a class="button" href="./resume.pdf" download>下载 PDF</a>
    </header>
    <main>
      <iframe src="./resume.pdf" title="简历 PDF"></iframe>
    </main>
  </body>
</html>
